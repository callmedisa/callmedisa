<svg xmlns="http://www.w3.org/2000/svg" width="460" height="300" viewBox="0 0 460 300" role="img" aria-label="Terminal: whoami, stack, tests passed">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; }
    .prompt { fill: #4ade80; }
    .cmd { fill: #e5e7eb; }
    .out { fill: #9ca3af; }
    .ok { fill: #4ade80; }
    .line { opacity: 0; animation: show 12s infinite; }
    .l1 { animation-delay: 0.3s; }
    .l2 { animation-delay: 1.1s; }
    .l3 { animation-delay: 2.1s; }
    .l4 { animation-delay: 2.9s; }
    .l5 { animation-delay: 3.4s; }
    .l6 { animation-delay: 4.4s; }
    .l7 { animation-delay: 5.4s; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes show {
      0% { opacity: 0; }
      3% { opacity: 1; }
      90% { opacity: 1; }
      95%, 100% { opacity: 0; }
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="460" height="300" rx="12" fill="#0f172a"/>
  <rect width="460" height="34" rx="12" fill="#1e293b"/>
  <rect y="22" width="460" height="12" fill="#1e293b"/>
  <circle cx="20" cy="17" r="6" fill="#f87171"/>
  <circle cx="40" cy="17" r="6" fill="#fbbf24"/>
  <circle cx="60" cy="17" r="6" fill="#4ade80"/>
  <text x="230" y="22" text-anchor="middle" class="mono out" font-size="12">dias@astana: ~</text>

  <g class="mono">
    <text x="20" y="70" class="line l1"><tspan class="prompt">$ </tspan><tspan class="cmd">whoami</tspan></text>
    <text x="20" y="94" class="line l2 out">dias — full-stack developer, Kazakhstan</text>

    <text x="20" y="130" class="line l3"><tspan class="prompt">$ </tspan><tspan class="cmd">cat stack.txt</tspan></text>
    <text x="20" y="154" class="line l4 out">python · fastapi · flask · postgres</text>
    <text x="20" y="178" class="line l5 out">react · next.js · flutter · docker</text>

    <text x="20" y="214" class="line l6"><tspan class="prompt">$ </tspan><tspan class="cmd">pytest -q</tspan></text>
    <text x="20" y="238" class="line l7 ok">all tests passed ✓</text>

    <text x="20" y="274"><tspan class="prompt">$ </tspan><tspan class="cmd cursor">▋</tspan></text>
  </g>
</svg>
